# Publishes the whole repository to GitHub Pages every time you commit to main.
# Save this as .github/workflows/main.yml in your repository.
name: Deploy static content to Pages

on:
  # Runs when you commit to the main branch
  push:
    branches: ["main"]
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

# Permissions GitHub needs to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # '.' means the whole repository: index.html, style.css and the images folder
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
